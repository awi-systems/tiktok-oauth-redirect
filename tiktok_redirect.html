<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok OAuth Redirect</title>
</head>
<body>
<h3>Processing TikTok Authorization...</h3>

<script>
  // -----------------------------
  // Configuration
  // -----------------------------
  const POWER_AUTOMATE_URL = "https://default8b9960bd61b9466580873fd16438c4.11.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/efec1f6b73e94552a2508307a999859b/triggers/manual/paths/invoke?api-version=1";

  // -----------------------------
  // Capture query parameters
  // -----------------------------
  const params = new URLSearchParams(window.location.search);
  const authCode = params.get("code");   // TikTok auth code
  const state = params.get("state");     // State returned by TikTok

  if (!authCode) {
    document.body.innerHTML = "<p style='color:red;'>No auth code found. Please try again.</p>";
  } else {
    document.body.innerHTML = "<p>Authorization successful! You can close this page.</p>";

    // -----------------------------
    // Send auth code and state to Power Automate
    // -----------------------------
    fetch(POWER_AUTOMATE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        code: authCode,
        state: state
      })
    })
    .then(response => console.log("Auth code sent to Power Automate", response))
    .catch(error => console.error("Error sending auth code:", error));
  }
</script>

</body>
</html>
